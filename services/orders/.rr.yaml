version: "3"

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php app.php"
  relay: pipes

http:
  address: 0.0.0.0:8080
  pool:
    num_workers: ${RR_HTTP_WORKERS:-4}

# Підключення до RabbitMQ — сервіс лише ПУБЛІКУЄ задачі (consume порожній)
amqp:
  addr: ${AMQP_DSN:-amqp://guest:guest@rabbitmq:5672}

jobs:
  pool:
    num_workers: 1
  consume: [ ]
  pipelines:
    notifications:
      driver: amqp
      config:
        queue: notifications
        exchange: shop.events
        exchange_type: direct
        routing_key: notifications
        durable: true

status:
  address: 0.0.0.0:2114

logs:
  mode: production
  level: info
  encoding: json
