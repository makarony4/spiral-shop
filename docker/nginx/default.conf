# API Gateway: єдина точка входу для клієнтів (лише публічне HTTP API).
# Міжсервісний gRPC (catalog:9001) живе тільки у внутрішній docker-мережі.

upstream catalog { server catalog:8080; }
upstream orders  { server orders:8080; }

server {
    listen 80;
    default_type application/json;

    location /api/products {
        proxy_pass http://catalog;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/orders {
        proxy_pass http://orders;
        include /etc/nginx/proxy_params.conf;
    }

    location = /health {
        return 200 '{"status":"ok"}';
    }

    location / {
        return 404 '{"error":"Not found"}';
    }
}
